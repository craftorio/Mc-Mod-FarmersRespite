name: Release

# Tag formats (use hyphen — GitHub tag filters reject '+' patterns):
#   <mc>-<mod>-<craftorio>                    e.g. 1.20.1-2.1.2-3  (matches jar name)
#   <mod>-<craftorio>                           e.g. 2.1.2-3
#   release/<mc>-<mod>-<craftorio>              e.g. release/1.20.1-2.1.2-3
#   <mod_version>                               e.g. 2.1.2  (craftorio from gradle.properties)
on:
  push:
    tags:
      - "release/*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      mod_version:
        description: Mod version
        required: true
        default: "2.1.2"
      craftorio_version:
        description: Craftorio version suffix
        required: true
        default: "3"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve versions
        id: versions
        run: |
          craftorio_default="$(grep '^craftorio_version=' gradle.properties | cut -d= -f2)"
          minecraft_default="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"

          parse_payload() {
            local payload="$1"

            if [[ "$payload" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              tag_minecraft_version="${BASH_REMATCH[1]}"
              mod_version="${BASH_REMATCH[2]}"
              craftorio_version="${BASH_REMATCH[3]}"
              if [[ "$tag_minecraft_version" != "$minecraft_default" ]]; then
                echo "::warning::Tag minecraft version $tag_minecraft_version differs from gradle.properties ($minecraft_default)"
              fi
              return 0
            fi

            if [[ "$payload" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              mod_version="${BASH_REMATCH[1]}"
              craftorio_version="${BASH_REMATCH[2]}"
              return 0
            fi

            if [[ "$payload" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              mod_version="$payload"
              craftorio_version="$craftorio_default"
              echo "Using craftorio version from gradle.properties: $craftorio_version"
              return 0
            fi

            return 1
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mod_version="${{ github.event.inputs.mod_version }}"
            craftorio_version="${{ github.event.inputs.craftorio_version }}"
            release_tag="${minecraft_default}-${mod_version}-${craftorio_version}"
          else
            release_tag="${GITHUB_REF_NAME}"

            if [[ "$release_tag" == release/* ]]; then
              payload="${release_tag#release/}"
            else
              payload="$release_tag"
            fi

            if ! parse_payload "$payload"; then
              echo "::error::Unsupported tag: $release_tag"
              exit 1
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_default" >> "$GITHUB_OUTPUT"
          echo "craftorio_version=$craftorio_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: |
          ./gradlew build --no-daemon \
            -Pmod_version="${{ steps.versions.outputs.mod_version }}" \
            -Pcraftorio_version="${{ steps.versions.outputs.craftorio_version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versions.outputs.release_tag }}
          name: Farmer's Respite ${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.craftorio_version }}
          body: |
            Mod version: `${{ steps.versions.outputs.mod_version }}`
            Minecraft: `${{ steps.versions.outputs.minecraft_version }}`
            Craftorio suffix: `${{ steps.versions.outputs.craftorio_version }}`
            Tag: `${{ steps.versions.outputs.release_tag }}`
          files: build/libs/FarmersRespite-${{ steps.versions.outputs.minecraft_version }}-${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.craftorio_version }}.jar
          generate_release_notes: true
